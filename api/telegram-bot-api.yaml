                $ref: '#/components/schemas/ErrorResponse'
  /unpinAllChatMessages:
    post:
      operationId: unpinAllChatMessages
      tags:
        - Available methods
      description: |-
        Use this method to clear the list of pinned messages in a chat. In private chats and channel direct messages chats, no additional rights are required to unpin all pinned messages. Conversely, the bot must be an administrator with the 'can_pin_messages' right or the 'can_edit_messages' right to unpin all pinned messages in groups and channels respectively. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: integer
                  format: int64
                  description: Unique identifier for the target chat or username of the target channel in the format @username
              required:
                - chat_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /unpinAllForumTopicMessages:
    post:
      operationId: unpinAllForumTopicMessages
      tags:
        - Available methods
      description: |-
        Use this method to clear the list of pinned messages in a forum topic in a forum supergroup chat or a private chat with a user. In the case of a supergroup chat the bot must be an administrator in the chat for this to work and must have the can_pin_messages administrator right in the supergroup. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: integer
                  format: int64
                  description: Unique identifier for the target chat or username of the target supergroup in the format @username
                message_thread_id:
                  type: integer
                  description: Unique identifier for the target message thread of the forum topic
              required:
                - chat_id
                - message_thread_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /unpinAllGeneralForumTopicMessages:
    post:
      operationId: unpinAllGeneralForumTopicMessages
      tags:
        - Available methods
      description: |-
        Use this method to clear the list of pinned messages in a General forum topic. The bot must be an administrator in the chat for this to work and must have the can_pin_messages administrator right in the supergroup. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: integer
                  format: int64
                  description: Unique identifier for the target chat or username of the target supergroup in the format @username
              required:
