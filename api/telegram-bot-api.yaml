      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /unpinChatMessage:
    post:
      operationId: unpinChatMessage
      tags:
        - Available methods
      description: |-
        Use this method to remove a message from the list of pinned messages in a chat. In private chats and channel direct messages chats, all messages can be unpinned. Conversely, the bot must be an administrator with the 'can_pin_messages' right or the 'can_edit_messages' right to unpin messages in groups and channels respectively. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                business_connection_id:
                  type: string
                  description: Unique identifier of the business connection on behalf of which the message will be unpinned
                chat_id:
                  type: integer
                  format: int64
                  description: Unique identifier for the target chat or username of the target channel in the format @username
                message_id:
                  type: integer
                  description: Identifier of the message to unpin. Required if business_connection_id is specified. If not specified, the most recent pinned message (by sending date) will be unpinned.
              required:
                - chat_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /upgradeGift:
    post:
      operationId: upgradeGift
      tags:
        - Available methods
      description: |-
        Upgrades a given regular gift to a unique gift. Requires the can_transfer_and_upgrade_gifts business bot right. Additionally requires the can_transfer_stars business bot right if the upgrade is paid. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                business_connection_id:
                  type: string
                  description: Unique identifier of the business connection
                keep_original_details:
                  type: boolean
                  description: Pass True to keep the original gift text, sender and receiver in the upgraded gift
                owned_gift_id:
                  type: string
                  description: Unique identifier of the regular gift that should be upgraded to a unique one
                star_count:
                  type: integer
                  description: The amount of Telegram Stars that will be paid for the upgrade from the business account balance. If gift.prepaid_upgrade_star_count > 0, then pass 0, otherwise, the can_transfer_stars business bot right is required and gift.upgrade_star_count must be passed.
              required:
                - business_connection_id
                - owned_gift_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /uploadStickerFile:
    post:
      operationId: uploadStickerFile
      tags:
        - Stickers
      description: |-
        Use this method to upload a file with a sticker for later use in the createNewStickerSet, addStickerToSet, or replaceStickerInSet methods (the file can be used multiple times). Returns the uploaded File on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sticker_format:
                  type: string
                  description: Format of the sticker, must be one of “static”, “animated”, “video”
                user_id:
                  type: integer
                  description: User identifier of sticker file owner
              required:
                - sticker_format
                - user_id
          multipart/form-data:
            schema:
              type: object
              properties:
                sticker:
                  type: string
                  format: binary
                  description: A file with the sticker in .WEBP, .PNG, .TGS, or .WEBM format. See https://core.telegram.org/stickers for technical requirements. More information on Sending Files »
                sticker_format:
                  type: string
                  description: Format of the sticker, must be one of “static”, “animated”, “video”
                user_id:
                  type: integer
                  description: User identifier of sticker file owner
              required:
                - sticker
                - sticker_format
                - user_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/File'
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /verifyChat:
    post:
      operationId: verifyChat
      tags:
        - Available methods
      description: |-
        Verifies a chat on behalf of the organization which is represented by the bot. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: integer
                  format: int64
                  description: Unique identifier for the target chat or username of the target bot, supergroup or channel in the format @username. Channel direct messages chats can't be verified.
                custom_description:
                  type: string
                  description: Custom description for the verification; 0-70 characters. Must be empty if the organization isn't allowed to provide a custom verification description.
              required:
                - chat_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /verifyUser:
    post:
      operationId: verifyUser
      tags:
        - Available methods
      description: |-
        Verifies a user on behalf of the organization which is represented by the bot. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                custom_description:
                  type: string
                  description: Custom description for the verification; 0-70 characters. Must be empty if the organization isn't allowed to provide a custom verification description.
                user_id:
                  type: integer
                  description: Unique identifier of the target user
              required:
                - user_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    TelegramBotToken:
      type: http
      scheme: bearer
      bearerFormat: TelegramBotToken
      description: Telegram bot token included in the request URL segment (bot{token}).
  schemas:
   AcceptedGiftTypes:
      type: object
      description: |-
        This object describes the types of gifts that can be gifted to a user or a chat.
      x-tags:
        - Available types
      properties:
        unlimited_gifts:
          type: boolean
          description: True, if unlimited regular gifts are accepted
        limited_gifts:
          type: boolean
          description: True, if limited regular gifts are accepted
        unique_gifts:
          type: boolean
          description: True, if unique gifts or gifts that can be upgraded to unique for free are accepted
        premium_subscription:
          type: boolean
          description: True, if a Telegram Premium subscription is accepted
        gifts_from_channels:
          type: boolean
          description: True, if transfers of unique gifts from channels are accepted
      required:
        - unlimited_gifts
        - limited_gifts
        - unique_gifts
        - premium_subscription
        - gifts_from_channels
   AffiliateInfo:
      type: object
      description: |-
        Contains information about the affiliate that received a commission via this transaction.
      x-tags:
        - Payments
      properties:
        affiliate_user:
          description: Optional. The bot or the user that received an affiliate commission if it was received by a bot or a user
          allOf:
              - $ref: '#/components/schemas/User'
        affiliate_chat:
          description: Optional. The chat that received an affiliate commission if it was received by a chat
          allOf:
              - $ref: '#/components/schemas/Chat'
        commission_per_mille:
          type: integer
          description: The number of Telegram Stars received by the affiliate for each 1000 Telegram Stars received by the bot from referred users
        amount:
          type: integer
          description: Integer amount of Telegram Stars received by the affiliate from the transaction, rounded to 0; can be negative for refunds
        nanostar_amount:
          type: integer
          description: Optional. The number of 1/1000000000 shares of Telegram Stars received by the affiliate; from -999999999 to 999999999; can be negative for refunds
      required:
        - commission_per_mille
        - amount
   Animation:
      type: object
      description: |-
        This object represents an animation file (GIF or H.264/MPEG-4 AVC video without sound).
      x-tags:
        - Available types
      properties:
        file_id:
          type: string
          description: Identifier for this file, which can be used to download or reuse the file
        file_unique_id:
          type: string
          description: Unique identifier for this file, which is supposed to be the same over time and for different bots. Can't be used to download or reuse the file.
        width:
          type: integer
          description: Video width as defined by the sender
        height:
          type: integer
          description: Video height as defined by the sender
        duration:
          type: integer
          description: Duration of the video in seconds as defined by the sender
        thumbnail:
          description: Optional. Animation thumbnail as defined by the sender
          allOf:
              - $ref: '#/components/schemas/PhotoSize'
        file_name:
          type: string
          description: Optional. Original animation filename as defined by the sender
        mime_type:
          type: string
          description: Optional. MIME type of the file as defined by the sender
        file_size:
          type: integer
          format: int64
          description: Optional. File size in bytes. It can be bigger than 2^31 and some programming languages may have difficulty/silent defects in interpreting it. But it has at most 52 significant bits, so a signed 64-bit integer or double-precision float type are safe for storing this value.
      required:
        - file_id
        - file_unique_id
        - width
        - height
        - duration
   Audio:
      type: object
      description: |-
        This object represents an audio file to be treated as music by the Telegram clients.
      x-tags:
        - Available types
      properties:
        file_id:
          type: string
          description: Identifier for this file, which can be used to download or reuse the file
        file_unique_id:
          type: string
          description: Unique identifier for this file, which is supposed to be the same over time and for different bots. Can't be used to download or reuse the file.
        duration:
          type: integer
          description: Duration of the audio in seconds as defined by the sender
        performer:
          type: string
          description: Optional. Performer of the audio as defined by the sender or by audio tags
        title:
          type: string
          description: Optional. Title of the audio as defined by the sender or by audio tags
        file_name:
          type: string
          description: Optional. Original filename as defined by the sender
        mime_type:
          type: string
          description: Optional. MIME type of the file as defined by the sender
        file_size:
          type: integer
          format: int64
          description: Optional. File size in bytes. It can be bigger than 2^31 and some programming languages may have difficulty/silent defects in interpreting it. But it has at most 52 significant bits, so a signed 64-bit integer or double-precision float type are safe for storing this value.
        thumbnail:
          description: Optional. Thumbnail of the album cover to which the music file belongs
          allOf:
              - $ref: '#/components/schemas/PhotoSize'
      required:
        - file_id
        - file_unique_id
        - duration
   BackgroundFill:
      type: object
      description: |-
        This object describes the way a background is filled based on the selected colors. Currently, it can be one of
        BackgroundFillSolid
        BackgroundFillGradient
        BackgroundFillFreeformGradient
      x-tags:
        - Available types
   BackgroundFillFreeformGradient:
      type: object
      description: |-
        The background is a freeform gradient that rotates after every message in the chat.
      x-tags:
        - Available types
      properties:
        type:
          type: string
          description: Type of the background fill, always “freeform_gradient”
        colors:
          type: array
          description: A list of the 3 or 4 base colors that are used to generate the freeform gradient in the RGB24 format
          items:
              type: integer
      required:
        - type
        - colors
   BackgroundFillGradient:
      type: object
      description: |-
        The background is a gradient fill.
      x-tags:
        - Available types
      properties:
        type:
          type: string
          description: Type of the background fill, always “gradient”
        top_color:
          type: integer
          description: Top color of the gradient in the RGB24 format
        bottom_color:
          type: integer
          description: Bottom color of the gradient in the RGB24 format
        rotation_angle:
          type: integer
          description: Clockwise rotation angle of the background fill in degrees; 0-359
      required:
        - type
        - top_color
        - bottom_color
        - rotation_angle
   BackgroundFillSolid:
      type: object
      description: |-
        The background is filled using the selected color.
      x-tags:
        - Available types
      properties:
        type:
          type: string
          description: Type of the background fill, always “solid”
        color:
          type: integer
          description: The color of the background fill in the RGB24 format
      required:
        - type
        - color
   BackgroundType:
      type: object
      description: |-
        This object describes the type of a background. Currently, it can be one of
        BackgroundTypeFill
        BackgroundTypeWallpaper
        BackgroundTypePattern
        BackgroundTypeChatTheme
      x-tags:
        - Available types
   BackgroundTypeChatTheme:
      type: object
      description: |-
        The background is taken directly from a built-in chat theme.
      x-tags:
        - Available types
      properties:
        type:
          type: string
          description: Type of the background, always “chat_theme”
        theme_name:
          type: string
          description: Name of the chat theme, which is usually an emoji
      required:
        - type
        - theme_name
   BackgroundTypeFill:
      type: object
      description: |-
        The background is automatically filled based on the selected colors.
      x-tags:
        - Available types
      properties:
        type:
          type: string
          description: Type of the background, always “fill”
        fill:
          description: The background fill
          allOf:
              - $ref: '#/components/schemas/BackgroundFill'
        dark_theme_dimming:
          type: integer
          description: Dimming of the background in dark themes, as a percentage; 0-100
      required:
        - type
        - fill
        - dark_theme_dimming
   BackgroundTypePattern:
      type: object
      description: |-
        The background is a .PNG or .TGV (gzipped subset of SVG with MIME type “application/x-tgwallpattern”) pattern to be combined with the background fill chosen by the user.
      x-tags:
        - Available types
      properties:
        type:
          type: string
          description: Type of the background, always “pattern”
        document:
          description: Document with the pattern
          allOf:
              - $ref: '#/components/schemas/Document'
        fill:
          description: The background fill that is combined with the pattern
          allOf:
              - $ref: '#/components/schemas/BackgroundFill'
        intensity:
          type: integer
          description: Intensity of the pattern when it is shown above the filled background; 0-100
        is_inverted:
          type: boolean
          description: Optional. True, if the background fill must be applied only to the pattern itself. All other pixels are black in this case. For dark themes only.
          default: true
        is_moving:
          type: boolean
          description: Optional. True, if the background moves slightly when the device is tilted
          default: true
      required:
        - type
        - document
        - fill
        - intensity
   BackgroundTypeWallpaper:
      type: object
      description: |-
        The background is a wallpaper in the JPEG format.
      x-tags:
        - Available types
      properties:
        type:
          type: string
          description: Type of the background, always “wallpaper”
        document:
          description: Document with the wallpaper
          allOf:
              - $ref: '#/components/schemas/Document'
        dark_theme_dimming:
          type: integer
          description: Dimming of the background in dark themes, as a percentage; 0-100
        is_blurred:
          type: boolean
          description: Optional. True, if the wallpaper is downscaled to fit in a 450x450 square and then box-blurred with radius 12
          default: true
        is_moving:
          type: boolean
          description: Optional. True, if the background moves slightly when the device is tilted
          default: true
      required:
        - type
        - document
        - dark_theme_dimming
   Birthdate:
      type: object
      description: |-
        Describes the birthdate of a user.
      x-tags:
        - Available types
      properties:
        day:
          type: integer
          description: Day of the user's birth; 1-31
        month:
          type: integer
          description: Month of the user's birth; 1-12
        year:
          type: integer
          description: Optional. Year of the user's birth
      required:
        - day
        - month
   BotAccessSettings:
      type: object
      description: |-
        This object describes the access settings of a bot.
      x-tags:
        - Available types
      properties:
        is_access_restricted:
          type: boolean
          description: True, if only selected users can access the bot. The bot's owner can always access it.
        added_users:
          type: array
          description: Optional. The list of other users who have access to the bot if the access is restricted
          items:
              $ref: '#/components/schemas/User'
      required:
        - is_access_restricted
   BotCommand:
      type: object
      description: |-
        This object represents a bot command.
      x-tags:
        - Available types
      properties:
        command:
          type: string
          description: Text of the command; 1-32 characters. Can contain only lowercase English letters, digits and underscores.
        description:
          type: string
          description: Description of the command; 1-256 characters
        is_ephemeral:
          type: boolean
          description: Optional. True, if the command sends an ephemeral message, which can be seen only by the sender of the message and the bot
      required:
        - command
        - description
   BotCommandScope:
      type: object
      description: |-
        This object represents the scope to which bot commands are applied. Currently, the following 7 scopes are supported:
        BotCommandScopeDefault
        BotCommandScopeAllPrivateChats
        BotCommandScopeAllGroupChats
        BotCommandScopeAllChatAdministrators
        BotCommandScopeChat
        BotCommandScopeChatAdministrators
        BotCommandScopeChatMember
      x-tags:
        - Available types
   BotCommandScopeAllChatAdministrators:
      type: object
      description: |-
        Represents the scope of bot commands, covering all group and supergroup chat administrators.
      x-tags:
        - Available types
      properties:
        type:
          type: string
          description: Scope type, must be all_chat_administrators
      required:
        - type
   BotCommandScopeAllGroupChats:
      type: object
      description: |-
        Represents the scope of bot commands, covering all group and supergroup chats.
      x-tags:
        - Available types
      properties:
        type:
          type: string
          description: Scope type, must be all_group_chats
      required:
        - type
   BotCommandScopeAllPrivateChats:
      type: object
      description: |-
        Represents the scope of bot commands, covering all private chats.
      x-tags:
        - Available types
      properties:
        type:
          type: string
          description: Scope type, must be all_private_chats
      required:
        - type
   BotCommandScopeChat:
      type: object
      description: |-
        Represents the scope of bot commands, covering a specific chat.
      x-tags:
        - Available types
      properties:
        type:
          type: string
          description: Scope type, must be chat
        chat_id:
          type: integer
          format: int64
          description: Unique identifier for the target chat or username of the target supergroup in the format @username. Channel direct messages chats and channel chats aren't supported.
      required:
        - type
        - chat_id
   BotCommandScopeChatAdministrators:
      type: object
      description: |-
        Represents the scope of bot commands, covering all administrators of a specific group or supergroup chat.
      x-tags:
        - Available types
      properties:
        type:
          type: string
          description: Scope type, must be chat_administrators
        chat_id:
          type: integer
          format: int64
          description: Unique identifier for the target chat or username of the target supergroup in the format @username. Channel direct messages chats and channel chats aren't supported.
      required:
        - type
        - chat_id
   BotCommandScopeChatMember:
      type: object
      description: |-
        Represents the scope of bot commands, covering a specific member of a group or supergroup chat.
      x-tags:
        - Available types
      properties:
        type:
          type: string
          description: Scope type, must be chat_member
        chat_id:
          type: integer
          format: int64
          description: Unique identifier for the target chat or username of the target supergroup in the format @username. Channel direct messages chats and channel chats aren't supported.
        user_id:
          type: integer
          description: Unique identifier of the target user
      required:
        - type
        - chat_id
        - user_id
   BotCommandScopeDefault:
      type: object
      description: |-
        Represents the default scope of bot commands. Default commands are used if no commands with a narrower scope are specified for the user.
      x-tags:
        - Available types
      properties:
